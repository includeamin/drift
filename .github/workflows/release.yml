name: "Release"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to apply"
        required: true
        default: minor
        type: choice
        options: [major, minor, patch]
      dry_run:
        description: "Rehearse the release without pushing or publishing"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):')"

    # Pull requests always rehearse: every step runs except the ones that
    # push commits, push tags or publish a release.
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The built-in token is used deliberately: the job-level `contents:
          # write` permission covers pushing the bump commit, the tag and the
          # release, and it cannot expire the way a PAT can.
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: abatilo/actions-poetry@v3
        with:
          poetry-version: latest

      # Single source of truth: the next tag drives both pyproject.toml and
      # src/diff/__init__.py, so the three can never drift apart.
      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          latest="${latest:-v0.0.0}"
          IFS='.' read -r major minor patch <<< "${latest#v}"

          bump="${{ github.event.inputs.bump || 'minor' }}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          version="${major}.${minor}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: $latest)"

      - name: Apply the version to pyproject.toml and the package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          poetry version "$version"
          python - "$version" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          path = pathlib.Path("src/diff/__init__.py")
          updated, count = re.subn(
              r'^__version__\s*=\s*"[^"]*"',
              f'__version__ = "{version}"',
              path.read_text(encoding="utf-8"),
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not find __version__ in src/diff/__init__.py")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Verify the versions agree
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"
          pyproject="$(poetry version --short)"
          package="$(python -c "import re, pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/diff/__init__.py').read_text()).group(1))")"
          echo "tag=$expected pyproject=$pyproject package=$package"
          test "$expected" = "$pyproject"
          test "$expected" = "$package"

      # orhun/git-cliff-action is a Docker action whose image is based on Debian
      # buster. Buster is EOL and no longer served by deb.debian.org, so the
      # image build fails on `apt-get update`. Use the release binary instead.
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: "2.4.0"
        run: |
          set -euo pipefail
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 "$url" -o /tmp/git-cliff.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate the changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git-cliff --tag "${{ steps.version.outputs.tag }}" --output CHANGELOG.md
          # Release notes cover only this release, unlike the cumulative file.
          git-cliff --tag "${{ steps.version.outputs.tag }}" --unreleased --strip all \
            --output RELEASE_NOTES.md

      - name: Build the jdiff zipapp
        run: |
          set -euo pipefail
          mkdir -p artifacts staging
          cp -R src/diff staging/diff
          find staging -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          python -m zipapp staging \
            --main "diff.cli:run" \
            --python "/usr/bin/env python3" \
            --compress \
            --output artifacts/jdiff
          chmod +x artifacts/jdiff
          test "$(artifacts/jdiff --version)" = "jdiff ${{ steps.version.outputs.version }}"

      - name: Build the Python distributions
        run: |
          poetry build
          cp dist/* artifacts/

      - name: Commit and tag the release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/diff/__init__.py CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: the commit and tag were created locally but not pushed."
            git --no-pager show --stat --oneline HEAD
            exit 0
          fi

          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Upload the artifacts for inspection
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ steps.version.outputs.tag }}
          path: |
            artifacts/*
            CHANGELOG.md
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: Summarise the dry run
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Release dry run"
            echo
            echo "Nothing was pushed or published. This release **would** have produced:"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| pyproject.toml | \`$(poetry version --short)\` |"
            echo "| \`diff.__version__\` | \`$(python -c "import re, pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/diff/__init__.py').read_text()).group(1))")\` |"
            echo
            echo "### Artifacts"
            echo '```'
            ls -lh artifacts/
            echo '```'
            echo "### Release notes preview"
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          token: ${{ github.token }}
